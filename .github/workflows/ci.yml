name: ci

# PR と main への push のたびに、pytest（禁止語スキャンを含む）を実行する。
# 読み取り権限だけで動かし、秘密は使わない。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # tests/test_extension_js.py は node がないと skip になるので、明示的に入れる
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -q
